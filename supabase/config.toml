# Configuration Supabase CLI — Galerie Apanage
# (le project_id réel est renseigné après `supabase link` ; valeur par défaut locale)
project_id = "galerie-apanage"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

# Magic-link (OTP par e-mail), sans mot de passe — Portail client + Cockpit
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
